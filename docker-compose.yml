
services:
  db:
    image: postgres:17-alpine
    container_name: devspace_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - devspace_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devspace_user -d devspace"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devspace_data:
