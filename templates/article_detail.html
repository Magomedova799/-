<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ article.title }} | DevSpace</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        .detail-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px;
        }

        .back-link {
            display: inline-block;
            color: #a78bfa;
            text-decoration: none;
            margin-bottom: 25px;
        }

        .back-link:hover {
            color: white;
        }

        .article-card {
            background: #1b1b1b;
            border: 1px solid #303030;
            border-radius: 16px;
            padding: 35px;
        }

        .article-label {
            color: #a78bfa;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .article-title {
            color: white;
            font-size: 34px;
            line-height: 1.3;
            margin: 0 0 20px;
        }

        .article-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            color: #888;
            font-size: 14px;
            padding-bottom: 22px;
            border-bottom: 1px solid #303030;
        }

        .article-text {
            color: #ccc;
            font-size: 16px;
            line-height: 1.9;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            margin-top: 25px;
        }

        @media (max-width: 700px) {
            .detail-content {
                padding: 15px;
            }

            .article-card {
                padding: 22px;
            }

            .article-title {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>DevSpace</h2>

        <nav class="navigation">
            <a href="/">Главная</a>
            <a href="/#courses">Курсы</a>
            <a href="/#projects">Проекты</a>
            <a href="/#articles">Статьи</a>
            <a href="/profile">Профиль</a>
        </nav>
    </div>

    <div class="main">
        <div class="detail-content">

            <a href="/#articles" class="back-link">
                ← Назад к статьям
            </a>

            <article class="article-card">

                <div class="article-label">
                    Статья DevSpace
                </div>

                <h1 class="article-title">
                    {{ article.title }}
                </h1>

                <div class="article-meta">

                    <span>
                        Автор:
                        {{ author.username if author else "Неизвестен" }}
                    </span>

                    {% if article.created_at %}
                        <span>
                            Опубликовано:
                            {{ article.created_at.strftime("%d.%m.%Y") }}
                        </span>
                    {% endif %}

                </div>

                <div class="article-text">{{ article.content }}</div>

            </article>

        </div>
    </div>

</body>
</html>
