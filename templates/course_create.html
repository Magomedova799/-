```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать курс — DevSpace</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<main class="create-container">
    <h1>Создать курс</h1>
    <p>Заполните информацию о вашем обучающем курсе.</p>

    <form action="/courses/create-form" method="post">

        <label>Название курса</label>
        <input
            type="text"
            name="title"
            minlength="3"
            maxlength="200"
            placeholder="Например, Python с нуля"
            required
        >

        <label>Описание курса</label>
        <textarea
            name="description"
            minlength="10"
            rows="7"
            placeholder="Расскажите, чему научатся участники курса..."
            required
        ></textarea>

        <label>Цена курса</label>
        <input
            type="number"
            name="price"
            min="0"
            step="0.01"
            value="0"
            required
        >

        <button type="submit">Создать курс</button>
    </form>

    <a href="/create">← Назад к выбору</a>
</main>

</body>
</html>
```
