
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание теста — DevSpace</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            background: #11111b;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .test-container {
            max-width: 850px;
            margin: 40px auto;
            padding: 30px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #20202a;
            color: white;
            box-sizing: border-box;
        }

        .question-card {
            padding: 22px;
            margin: 25px 0;
            border: 1px solid #444;
            border-radius: 12px;
            background: #191923;
        }

        .option-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-row input[type="radio"] {
            width: auto;
        }

        .option-row input[type="text"] {
            flex: 1;
        }

        button {
            padding: 13px 24px;
            border: none;
            border-radius: 8px;
            background: #7657e8;
            color: white;
            cursor: pointer;
        }

        .skip-link {
            margin-left: 15px;
            color: #aaa;
        }
    </style>
</head>

<body>

<main class="test-container">

    <h1>Создание теста</h1>

    <p>Урок: <strong>{{ lesson.title }}</strong></p>
    <p>Добавьте вопросы и отметьте правильные ответы.</p>

    <form action="/tests/create-form" method="post">

        <input type="hidden" name="lesson_id" value="{{ lesson.id }}">

        <label>Название теста</label>
        <input
            type="text"
            name="title"
            placeholder="Например: Проверка знаний по Python"
            maxlength="200"
            required
        >

        <label>Описание теста</label>
        <textarea
            name="description"
            rows="3"
            maxlength="500"
            placeholder="Краткое описание"
        ></textarea>

        {% for number in range(1, 6) %}

        <section class="question-card">

            <h3>Вопрос {{ number }}</h3>

            <label>Текст вопроса</label>
            <textarea
                name="question_{{ number }}"
                rows="2"
                placeholder="Введите вопрос"
                maxlength="1000"
            ></textarea>

            <p><strong>Варианты ответа</strong></p>
            <p>Отметьте кружком правильный вариант.</p>

            {% for option in range(1, 5) %}

            <div class="option-row">

                <input
                    type="radio"
                    name="correct_{{ number }}"
                    value="{{ option - 1 }}"
                >

                <input
                    type="text"
                    name="option_{{ number }}_{{ option }}"
                    placeholder="Вариант {{ option }}"
                >

            </div>

            {% endfor %}

        </section>

        {% endfor %}

        <button type="submit">
            Сохранить тест и продолжить
        </button>

        <a
            class="skip-link"
            href="/assignments/create-page?lesson_id={{ lesson.id }}"
        >
            Пропустить тест
        </a>

    </form>

</main>

</body>
</html>
